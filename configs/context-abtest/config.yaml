name: "context_abtest"
description: "A/B test comparing impact of implicit vs explicit system prompt instructions on tool usage."
repetitions: 2
max_concurrent: 4
timeout: "5m"
alternatives:
  - name: "control_no_context"
    description: "No GEMINI.md context file."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    env: {}
    settings_path: "settings-godoctor.json"

  - name: "alt1_standard_context"
    description: "Standard GEMINI.md context."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    env: {}
    settings_path: "settings-godoctor.json"
    context_file_path: "GEMINI_standard.md"

  - name: "alt2_explicit_context"
    description: "GEMINI.md with explicit instructions to use edit_code."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    env: {}
    settings_path: "settings-godoctor.json"
    context_file_path: "GEMINI_explicit.md"

scenarios:
  - name: "legacy_refactor"
  - name: "concurrency_debug"
