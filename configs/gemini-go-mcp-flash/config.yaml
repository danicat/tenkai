name: "gemini_go_mcp_flash"
description: "Standardized AB test comparing Vanilla, Go, GoDoctor, and agents using Gemini 2.5 Flash across standard scenarios."
repetitions: 3
max_concurrent: 8
alternatives:
  - name: "gemini_flash"
    description: "Control: Standard Gemini 2.5 Flash."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    env: {}

  - name: "gemini_flash_godoctor"
    description: "Gemini 2.5 Flash with GoDoctor MCP tools."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    env: {}
    settings_path: "settings-godoctor.json"

  - name: "gemini_flash_godoctor_agents"
    description: "Gemini 2.5 Flash with GoDoctor MCP tools and custom agents.md context."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    env: {}
    settings_path: "settings-godoctor.json"
    context_file_path: "GEMINI.md"

  - name: "gemini_flash_go"
    description: "Gemini 2.5 Flash with Go system prompt."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    env: 
      GEMINI_SYSTEM_MD: "/Users/petruzalek/.gemini/system.golang.md"

  - name: "gemini_flash_go_godoctor"
    description: "Gemini 2.5 Flash with both Go system prompt and GoDoctor MCP tools."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    env: 
      GEMINI_SYSTEM_MD: "/Users/petruzalek/.gemini/system.golang.md"
    settings_path: "settings-godoctor.json"

  - name: "gemini_flash_go_godoctor_agents"
    description: "Gemini 2.5 Flash with Go system prompt, GoDoctor MCP tools, and custom agents.md context."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    env: 
      GEMINI_SYSTEM_MD: "/Users/petruzalek/.gemini/system.golang.md"
    settings_path: "settings-godoctor.json"
    context_file_path: "GEMINI.md"

scenarios:
  - name: "greenfield_cli"
  - name: "legacy_refactor"
  - name: "concurrency_debug"
  - name: "test_generation"
  - name: "api_implementation"
