name: "tool_calling_opt"
description: "Analysis of various configuration layers for optimizing tool selection between built-in and MCP."
repetitions: 3
max_concurrent: 3
timeout: "5m"
alternatives:
  - name: "1_control"
    description: "Baseline behavior (no intervention)."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    settings_path: "settings-default.json"

  - name: "2_context_hint"
    description: "Soft hint via GEMINI.md."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    settings_path: "settings-default.json"
    context_file_path: "GEMINI_soft_hint.md"

  - name: "3_system_override"
    description: "Authoritative mandate via system.md (SYSTEM_OPTIMIZED.md)."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    settings_path: "settings-default.json"
    system_prompt_file: "SYSTEM_OPTIMIZED.md"

  - name: "4_hard_block"
    description: "Hard exclusion of shell tool via settings.json."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    settings_path: "settings-exclude-shell.json"

  - name: "5_policy_friction"
    description: "Policy Engine rule set to 'deny' for the shell tool."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    settings_path: "settings-default.json"
    policy_files: ["policy-deny-shell.toml"]

  - name: "6_ensemble"
    description: "Combines system_override and hard_block."
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    settings_path: "settings-exclude-shell.json"
    system_prompt_file: "SYSTEM_OPTIMIZED.md"

scenarios:
  - name: "go_symbol_listing"
