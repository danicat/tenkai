name: "system_prompt_study"
description: >
  Part 1: Optimizing the system prompt for Go and GoDoctor. 
  This experiment evaluates how specific prompt construction affects an agent's 
  idiomatic usage of Go and its willingness to discover and use specialized MCP tools.
repetitions: 1
max_concurrent: 3
timeout: "5m"
alternatives:
  - name: "1_default"
    description: >
      Standard Gemini CLI prompt (Control). 
      Condition: Baseline behavior using the original system prompt provided by the CLI.
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    system_prompt_file: "SYSTEM_DEFAULT.md"
    settings_path: "settings-default.json"

  - name: "2_go_optimized"
    description: >
      Go-centric prompt refinement. 
      Condition: Removes references to other languages and reinforces Go-specific idioms 
      (e.g., error handling, testing patterns) within the core mandate.
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    system_prompt_file: "SYSTEM_GO_OPTIMIZED.md"
    settings_path: "settings-default.json"

  - name: "3_default_godoctor"
    description: >
      Standard prompt + GoDoctor snippet. 
      Condition: Adds the 'godoctor --agents' instruction block to the baseline prompt 
      to provide direct awareness of specialized Go analysis tools.
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    system_prompt_file: "SYSTEM_DEFAULT_GODOCTOR.md"
    settings_path: "settings-default.json"

  - name: "4_go_godoctor"
    description: >
      Go-centric prompt + GoDoctor snippet. 
      Condition: Combines both the architectural optimization for Go and the explicit 
      tool awareness snippet for the specialized MCP server.
    command: "gemini"
    args: ["--output-format", "stream-json", "--yolo", "--model", "gemini-2.5-flash"]
    system_prompt_file: "SYSTEM_GO_GODOCTOR.md"
    settings_path: "settings-default.json"

scenarios:
  - name: "go_symbol_listing"
